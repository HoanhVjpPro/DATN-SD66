<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${product.productId != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'} + ' | HatHub'">Product Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    body { font-family:'Nunito',sans-serif; margin:0; display:flex; min-height:100vh; }
    aside { width:220px; background:#111; color:#fff; padding:1.5rem; }
    aside a { display:block; color:#ccc; text-decoration:none; padding:0.6rem 0; }
    aside a:hover, aside a.active { color:#C0633A; }
    main { flex:1; padding:2rem; background:#F5F0EA; }
    .card { background:#fff; padding:1.5rem; border-radius:8px; margin-bottom:1.5rem; }
    label { display:block; font-weight:700; margin:0.75rem 0 0.25rem; }
    input, select, textarea { width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    td, th { padding:0.5rem; border-bottom:1px solid #eee; text-align:left; }
    .success { background:#d4edda; padding:1rem; border-radius:4px; margin-bottom:1rem; }
    .stock-low { color:#c0392b; font-weight:700; }
    .stock-out { color:#fff; background:#c0392b; padding:2px 8px; border-radius:4px; font-size:0.8rem; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
    .topbar h1 { font-size:1.4rem; font-weight:900; }

    /* ===== Nút bấm — đồng bộ toàn hệ thống ===== */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:4px; font-family:'Nunito',sans-serif; font-weight:700; font-size:0.85rem; padding:9px 18px; cursor:pointer; text-decoration:none; line-height:1.2; white-space:nowrap; }
    .btn-sm { padding:6px 12px; font-size:0.8rem; }
    .btn-primary { background:#C0633A; color:#fff; }
    .btn-primary:hover { background:#9B4A27; }
    .btn-secondary { background:#444; color:#fff; }
    .btn-secondary:hover { background:#2c2c2c; }
    .btn-success { background:#27ae60; color:#fff; }
    .btn-success:hover { background:#1e8449; }
    .btn-danger { background:#c00; color:#fff; }
    .btn-danger:hover { background:#a00; }
    .btn-warning { background:#e67e22; color:#fff; }
    .btn-warning:hover { background:#c8611c; }
    .btn-info { background:#2980b9; color:#fff; }
    .btn-info:hover { background:#20648f; }
    .btn-neutral { background:#666; color:#fff; }
    .btn-neutral:hover { background:#4d4d4d; }
    .rte-toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      padding: 8px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 6px 6px 0 0;
    }
    .rte-toolbar button, .rte-toolbar input[type=color] {
      width: 36px;
      height: 32px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }
    .rte-toolbar button:hover { background: #eee; }
    .rte-editor {
      min-height: 180px;
      padding: 12px;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 6px 6px;
      background: #fff;
      outline: none;
      line-height: 1.6;
    }
    .rte-editor:focus { border-color: #C0633A; }
  </style>
</head>
<body>
<aside>
  <h2 style="color:#C0633A;">HatHub Admin</h2>
  <a href="/admin/dashboard">Dashboard</a>
  <a href="/admin/products" class="active">Sản phẩm</a>
  <a href="/admin/categories">Danh mục</a>
  <a href="/admin/brands">Thương hiệu</a>
  <a href="/admin/orders">Đơn hàng</a>
  <a href="/admin/returns">Trả hàng</a>
  <a href="/admin/vouchers">Voucher</a>
  <a href="/admin/users">Người dùng</a>
  <a href="/logout">Đăng xuất</a>
</aside>
<main>
  <div class="topbar">
    <h1 th:text="${product.productId != null ? 'Sửa sản phẩm' : 'Thêm sản phẩm'}">Form</h1>
    <a href="/admin/products" class="btn btn-neutral">← Quay lại</a>
  </div>
  <div th:if="${success}" class="success" th:text="${success}"></div>
  <div class="card">
    <form action="/admin/products/save" method="post">
      <input type="hidden" name="productId" th:value="${product.productId}"/>
      <label>Tên sản phẩm</label>
      <input type="text" name="productName" th:value="${product.productName}" required/>
      <label>Danh mục</label>
      <select name="categoryId" required>
        <option value="" disabled>-- chưa có --</option>
        <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"
                th:selected="${product.category != null and product.category.categoryId == c.categoryId}"></option>
      </select>
      <label>Thương hiệu</label>
      <select name="brandId">
        <option value="" disabled>-- chưa có --</option>
        <option th:each="b : ${brands}" th:value="${b.brandId}" th:text="${b.brandName}"
                th:selected="${product.brand != null and product.brand.brandId == b.brandId}"></option>
      </select>
      <label>Mô tả</label>
      <!-- Toolbar -->
      <div class="rte-toolbar">
        <button type="button" onclick="document.execCommand('bold')" title="Đậm"><b>B</b></button>
        <button type="button" onclick="document.execCommand('italic')" title="Nghiêng"><i>I</i></button>
        <button type="button" onclick="document.execCommand('underline')" title="Gạch chân"><u>U</u></button>
        <button type="button" onclick="toggleUppercase()" title="In hoa">AA</button>
        <input type="color" onchange="document.execCommand('foreColor', false, this.value)" title="Màu chữ" value="#000000"/>
        <button type="button" onclick="document.execCommand('removeFormat')" title="Xóa định dạng">✕</button>
      </div>

      <!-- Vùng soạn thảo hiển thị cho admin -->
      <div id="descriptionEditor"
           class="rte-editor"
           contenteditable="true"
           th:utext="${product.description}">
      </div>

      <!-- Ô ẩn thực sự gửi lên server -->
      <textarea name="description" id="descriptionHidden" style="display:none;"></textarea>
      <label><input type="checkbox" name="status" value="true" th:checked="${product.status == null or product.status}" style="width:auto;"/> Đang bán</label>
      <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Lưu sản phẩm</button>
    </form>
  </div>

  <div class="card" th:if="${product.productId != null}">
    <h3>Biến thể (Size / Màu / Giá / Tồn kho)</h3>

    <!-- FORM THÊM MỚI -->
    <form th:action="@{/admin/products/{id}/detail(id=${product.productId})}" method="post">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr auto;gap:0.5rem;align-items:end;">
        <div><label>Size</label><input name="size" required/></div>
        <div><label>Màu</label><input name="color" required/></div>
        <div><label>Giá</label><input name="price" min="0" type="number" step="1000" required/></div>
        <div><label>SKU</label><input name="sku"/></div>
        <div><label>Tồn kho</label><input name="stockQuantity" type="number" value="0" min="0" required/></div>
        <button type="submit" class="btn btn-primary" style="margin-top:1.5rem;">Thêm</button>
      </div>
    </form>

    <!-- BẢNG BIẾN THỂ -->
    <table th:if="${details != null}">
      <tr>
        <th>Ảnh</th><th>Size</th><th>Màu</th><th>Giá</th><th>SKU</th><th>Tồn kho</th><th>Thao tác</th>
      </tr>
      <tr th:each="d : ${details}"
          th:with="variantImages=${product.images != null ? product.images.?[productDetail != null and productDetail.productDetailId == __${d.productDetailId}__] : {}}">
        <td style="width:64px;">
          <img th:if="${!#lists.isEmpty(variantImages)}" th:src="${variantImages[0].imageURL}"
               style="width:56px;height:56px;object-fit:cover;border-radius:6px;"/>
          <span th:if="${#lists.isEmpty(variantImages)}" style="font-size:0.7rem;color:#999;">Chưa có ảnh</span>
        </td>
        <form th:action="@{/admin/products/detail/update/{id}(id=${d.productDetailId})}" method="post">
          <input type="hidden" name="productId" th:value="${product.productId}"/>
          <td><input name="size"          type="text"   th:value="${d.size}"          required style="padding:4px;border:1px solid #ddd;width:100%;"/></td>
          <td><input name="color"         type="text"   th:value="${d.color}"         required style="padding:4px;border:1px solid #ddd;width:100%;"/></td>
          <td><input name="price"         type="number" th:value="${d.price}"         step="1000" required style="padding:4px;border:1px solid #ddd;width:100%;" min="0"/></td>
          <td><input name="sku"           type="text"   th:value="${d.sku}"                   style="padding:4px;border:1px solid #ddd;width:100%;"/></td>
          <td>
            <input name="stockQuantity" type="number" th:value="${d.stockQuantity != null ? d.stockQuantity : 0}" min="0" required style="padding:4px;border:1px solid #ddd;width:70px;"/>
            <span th:if="${d.stockQuantity != null and d.stockQuantity == 0}"  style="color:#c00;font-size:0.75rem;display:block;">Hết hàng</span>
            <span th:if="${d.stockQuantity != null and d.stockQuantity > 0 and d.stockQuantity <= 5}" style="color:#e67e22;font-size:0.75rem;display:block;">Sắp hết</span>
          </td>
          <td style="display:flex;gap:6px;align-items:center;padding:8px 4px;">
            <!-- NÚT LƯU -->
            <button type="submit" class="btn btn-success btn-sm">Lưu</button>
        </form>
        <!-- NÚT XÓA — form riêng ngoài form sửa -->
        <form th:action="@{/admin/products/detail/delete/{id}(id=${d.productDetailId})}" method="post" style="display:inline;">
          <input type="hidden" name="productId" th:value="${product.productId}"/>
          <button type="submit" class="btn btn-danger btn-sm"
                  onclick="return confirm('Xóa biến thể này?')">Xóa</button>
        </form>
        </td>
      </tr>
    </table>

    <!-- UPLOAD ẢNH -->
    <h3 style="margin-top:1.5rem;">Upload ảnh</h3>
    <form th:action="@{/admin/products/{id}/image(id=${product.productId})}" method="post" enctype="multipart/form-data">
      <label>Hình ảnh</label>
      <input type="file" name="file" accept="image/*" required/>
      <label>Gắn cho biến thể</label>
      <select name="productDetailId">
        <option value="">-- Ảnh chung sản phẩm --</option>
        <option th:each="d : ${details}" th:value="${d.productDetailId}"
                th:text="${d.size} + ' / ' + ${d.color}"></option>
      </select>
      <label><input type="checkbox" name="isDefault" value="true" checked style="width:auto;"/> Ảnh mặc định</label>
      <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Upload</button>
    </form>
  </div>
</main>
</body>
<script>
  // In hoa phần văn bản đang bôi đen (execCommand không có sẵn lệnh này)
  function toggleUppercase() {
    const selection = window.getSelection();
    if (!selection.rangeCount || selection.isCollapsed) {
      alert('Vui lòng bôi đen đoạn chữ cần in hoa trước!');
      return;
    }
    const range = selection.getRangeAt(0);
    const selectedText = range.toString();
    const span = document.createElement('span');
    span.textContent = selectedText.toUpperCase();
    range.deleteContents();
    range.insertNode(span);
  }

  // Đồng bộ nội dung HTML vào textarea ẩn trước khi submit form
  document.querySelector('form').addEventListener('submit', function () {
    const editor = document.getElementById('descriptionEditor');
    document.getElementById('descriptionHidden').value = editor.innerHTML;
  });
</script>
</html>
