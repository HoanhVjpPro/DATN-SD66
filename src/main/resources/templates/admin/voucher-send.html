<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gửi voucher | HatHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family:'Nunito',sans-serif; margin:0; display:flex; min-height:100vh; }
        aside { width:220px; background:#111; color:#fff; padding:1.5rem; }
        aside a { display:block; color:#ccc; text-decoration:none; padding:0.6rem 0; }
        aside a:hover, aside a.active { color:#C0633A; }
        main { flex:1; padding:2rem; background:#F5F0EA; }
        table { width:100%; background:#fff; border-collapse:collapse; }
        th, td { padding:0.75rem; border-bottom:1px solid #eee; }
        th { background:#111; color:#fff; }
        .voucher-info { background:#fff; padding:1.5rem; border-radius:8px; margin-bottom:1.5rem; }
        .actions { display:flex; gap:8px; margin:1rem 0; align-items:center; }
        .alert { padding:12px; border-radius:4px; margin-bottom:1rem; }
        .alert.success { background:#d4edda; color:#155724; }
        .alert.error { background:#f8d7da; color:#721c24; }

        /* ===== Nút bấm — đồng bộ toàn hệ thống ===== */
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:4px; font-family:'Nunito',sans-serif; font-weight:700; font-size:0.85rem; padding:9px 18px; cursor:pointer; text-decoration:none; line-height:1.2; white-space:nowrap; }
        .btn-sm { padding:6px 12px; font-size:0.8rem; }
        .btn-primary { background:#C0633A; color:#fff; }
        .btn-primary:hover { background:#9B4A27; }
        .btn-secondary { background:#444; color:#fff; }
        .btn-secondary:hover { background:#2c2c2c; }
        .btn-success { background:#27ae60; color:#fff; }
        .btn-success:hover { background:#1e8449; }
        .btn-danger { background:#c00; color:#fff; }
        .btn-danger:hover { background:#a00; }
        .btn-warning { background:#e67e22; color:#fff; }
        .btn-warning:hover { background:#c8611c; }
        .btn-info { background:#2980b9; color:#fff; }
        .btn-info:hover { background:#20648f; }
        .btn-neutral { background:#666; color:#fff; }
        .btn-neutral:hover { background:#4d4d4d; }
    </style>
</head>
<body>
<aside>
    <h2 style="color:#C0633A;">HatHub Admin</h2>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/products">Sản phẩm</a>
    <a href="/admin/categories">Danh mục</a>
    <a href="/admin/brands">Thương hiệu</a>
    <a href="/admin/materials">Chất liệu</a>
    <a href="/admin/hat-types">Kiểu mũ</a>
    <a href="/admin/sizes">Size</a>
    <a href="/admin/colors">Màu sắc</a>
    <a href="/admin/orders">Đơn hàng</a>
    <a href="/admin/returns">Trả hàng</a>
    <a href="/admin/vouchers" class="active">Voucher</a>
    <a href="/admin/reviews">Đánh giá sản phẩm</a>
    <a href="/admin/users">Người dùng</a>
    <a href="/logout">Đăng xuất</a>
</aside>
<main>
    <h1>Gửi voucher qua email</h1>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div class="voucher-info">
        <strong>Mã voucher:</strong> <span th:text="${voucher.code}"></span><br/>
        <strong>Ưu đãi:</strong>
        <span th:if="${voucher.discountType == 'PERCENT'}"
              th:text="'Giảm ' + ${voucher.discountPercent} + '%'"></span>
        <span th:if="${voucher.discountType != 'PERCENT'}"
              th:text="'Giảm ' + ${#numbers.formatDecimal(voucher.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
    </div>

    <form th:action="@{/admin/vouchers/{id}/send(id=${voucher.voucherId})}" method="post">
        <div class="actions">
            <button type="submit" class="btn btn-primary">📧 Gửi cho tài khoản đã chọn</button>
            <a href="/admin/vouchers" class="btn btn-neutral">← Quay lại</a>
        </div>

        <table>
            <thead>
            <tr>
                <th style="width:40px;"><input type="checkbox" onclick="toggleAll(this)"/></th>
                <th>Tên đăng nhập</th>
                <th>Email</th>
                <th>Vai trò</th>
                <th>Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td>
                    <input type="checkbox" name="userIds" th:value="${u.userID}" class="user-checkbox"
                           th:disabled="${u.email == null or #strings.isEmpty(u.email)}"/>
                </td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email != null ? u.email : '(chưa có email)'}"></td>
                <td th:text="${u.role != null ? u.role.roleName : ''}"></td>
                <td th:text="${u.status != null and u.status ? 'Hoạt động' : 'Đã khóa'}"></td>
            </tr>
            </tbody>
        </table>
    </form>

    <form th:action="@{/admin/vouchers/{id}/send-all(id=${voucher.voucherId})}" method="post"
          onsubmit="return confirm('Gửi voucher cho TOÀN BỘ người dùng có email?')" style="margin-top:1rem;">
        <button type="submit" class="btn btn-success">📢 Gửi cho toàn bộ người dùng</button>
    </form>

    <script>
        function toggleAll(source) {
            document.querySelectorAll('.user-checkbox:not(:disabled)').forEach(function (cb) {
                cb.checked = source.checked;
            });
        }
    </script>
</main>
</body>
</html>
