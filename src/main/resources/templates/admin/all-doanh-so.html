<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Doanh số sản phẩm | HatHub Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family:'Nunito',sans-serif; margin:0; display:flex; min-height:100vh; }
        aside { width:220px; background:#111; color:#fff; padding:1.5rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0;}
        aside a { display:block; color:#ccc; text-decoration:none; padding:0.6rem 0; }
        aside a:hover, aside a.active { color:#C0633A; }
        main { flex:1; padding:2rem; background:#F5F0EA; }
        table { width:100%; background:#fff; border-collapse:collapse; }
        th, td { padding:0.75rem; border-bottom:1px solid #eee; text-align:left; }
        th { background:#111; color:#fff; font-size:0.8rem; text-transform:uppercase; }
        td.num { text-align:right; }
        th.num { text-align:right; }
        .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
        .btn-back { background:#666; color:#fff; text-decoration:none; padding:8px 18px; border-radius:4px; font-weight:700; }
        .rank { display:inline-block; width:26px; height:26px; border-radius:50%; background:#C0633A; color:#fff; text-align:center; line-height:26px; font-weight:700; font-size:0.8rem; }
        input#searchInput { padding:8px 12px; border:1px solid #ddd; border-radius:4px; width:280px; margin-bottom:1rem; }
    </style>
</head>
<body>
<aside>
    <h2 style="color:#C0633A;">HatHub Admin</h2>
    <a href="/admin/dashboard" class="active">Dashboard</a>
    <a href="/admin/products">Sản phẩm</a>
    <a href="/admin/categories">Danh mục</a>
    <a href="/admin/brands">Thương hiệu</a>
    <a href="/admin/materials">Chất liệu</a>
    <a href="/admin/hat-types">Kiểu mũ</a>
    <a href="/admin/sizes">Size</a>
    <a href="/admin/colors">Màu sắc</a>
    <a href="/admin/orders">Đơn hàng</a>
    <a href="/admin/returns">Trả hàng</a>
    <a href="/admin/vouchers">Voucher</a>
    <a href="/admin/users">Người dùng</a>
    <a href="/logout">Đăng xuất</a>
</aside>
<main>
    <div class="topbar">
        <h1>Doanh số toàn bộ sản phẩm</h1>
        <a href="/admin/dashboard" class="btn-back">← Quay lại Dashboard</a>
    </div>

    <input type="text" id="searchInput" placeholder="Tìm theo tên sản phẩm..." onkeyup="filterTable()"/>

    <table id="salesTable">
        <thead>
        <tr>
            <th style="width:60px;">#</th>
            <th>Sản phẩm</th>
            <th class="num">Số lượng bán</th>
            <th class="num">Doanh thu</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p, iter : ${productSales}">
            <td><span th:text="${iter.count}">1</span></td>
            <td class="product-name" th:text="${p.productName}">Tên sản phẩm</td>
            <td class="num" th:text="${p.totalQty}">0</td>
            <td class="num" th:text="${#numbers.formatDecimal(p.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
        </tr>
        <tr th:if="${productSales == null or #lists.isEmpty(productSales)}">
            <td colspan="4" style="text-align:center;padding:2rem;color:#999;">Chưa có dữ liệu bán hàng</td>
        </tr>
        </tbody>
    </table>
</main>

<script>
    function filterTable() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('#salesTable tbody tr').forEach(row => {
            const nameCell = row.querySelector('.product-name');
            if (!nameCell) return;
            row.style.display = nameCell.textContent.toLowerCase().includes(keyword) ? '' : 'none';
        });
    }
</script>
</body>
</html>
