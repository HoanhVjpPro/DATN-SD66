<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Có thể bạn cũng thích | HatHub</title>
    <link rel="stylesheet" th:href="@{/shop.css}" />
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Inter', sans-serif;
            color: #333;
            margin: 0;
            padding-bottom: 50px;
        }
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            height: 64px;
        }
        .Dgq7m3 {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-transform: uppercase;
            text-align: center;
            background-image: url('https://deo.shopeemobile.com/shopee/shopee-pcmall-live-sg/rcmd/4d06bff56c024b35.svg');
            background-position: 50%;
            background-repeat: no-repeat;
            background-size: contain;
            margin: 30px 0;
            padding: 10px 0;
            font-size: 20px;
            font-weight: 500;
            color: #555;
            letter-spacing: 1px;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .product-item {
            background: #fff;
            padding: 12px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
            text-decoration: none;
            transition: .25s;
        }
        .product-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,.15);
        }
        .product-item img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .product-name {
            font-size: 14px;
            color: #222;
            margin: 10px 0 5px;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .product-price {
            color: #ee4d2d;
            font-size: 16px;
            font-weight: bold;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #555;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            color: #ee4d2d;
        }
    </style>
</head>
<body>
    <nav class="shop-nav" style="background: #222; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="/" class="brand" style="display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: bold;">
            <img th:src="@{/logo.jpg}" src="/logo.jpg" alt="HatHub Logo" style="height:44px;width:auto;object-fit:contain;border-radius:50%;">
            <span style="font-size: 18px; letter-spacing: 0.5px;">HATHUB</span>
        </a>

        <div class="nav-actions" style="display: flex; align-items: center; gap: 15px;">
            <a href="/profile" class="btn-cart" style="color: #fff; text-decoration: none; font-size: 18px;" title="Tài khoản">👤</a>
            <a href="/cart" class="btn-cart" style="color: #fff; text-decoration: none; font-size: 18px;" title="Giỏ hàng">🛒</a>
            <a href="/orders" class="btn-cart" style="color: #fff; text-decoration: none; font-size: 18px;" title="Đơn hàng">🧾</a>
            <a href="/logout" style="color: #ff4d4d; text-decoration: none; font-size: 14px; font-weight: 500; margin-left: 5px;">Đăng xuất</a>
        </div>
    </nav>

    <div class="container">
    <!--    <a href="/cart" class="back-link">← Quay lại giỏ hàng</a>-->
        <div class="Dgq7m3">Có Thể Bạn Cũng Thích</div>

        <div class="product-grid">
            <div th:each="p : ${allRecommendProducts}" class="product-item">
                <a th:href="@{'/products/' + ${p.productId}}" style="text-decoration: none; color: inherit;">
                    <img th:if="${p.images != null and !#lists.isEmpty(p.images)}"
                         th:src="@{${p.images[0].imageURL}}" alt="Product">
                    <img th:unless="${p.images != null and !#lists.isEmpty(p.images)}"
                         th:src="@{/images/no-image.png}" alt="Product">

                    <div class="product-name" th:text="${p.productName}">Tên sản phẩm</div>

                    <div class="product-price"
                         th:if="${p.details != null and !#lists.isEmpty(p.details)}"
                         th:text="${#numbers.formatDecimal(p.details[0].price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                        0 đ
                    </div>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
