<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Có thể bạn cũng thích | HatHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Oswald:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/shop.css}" />
    <style>
        :root {
            --rust: #C0633A;
            --rust-light: #D47A4F;
            --rust-dark: #A04E2E;
            --rust-glow: rgba(192, 99, 58, 0.25);
            --bg-body: #ffffff;
            --bg-card: #f8f8f8;
            --bg-elevated: #eeeeee;
            --border-subtle: #e0e0e0;
            --border-hover: #cccccc;
            --text-primary: #1a1a1a;
            --text-secondary: #333333;
            --text-muted: #777777;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: var(--text-primary);
        }
        .shop-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
        <!--          background: #ffffff;-->
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .shop-nav .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.35rem;
            color: #1a1a1a;
            text-decoration: none;
        }
        .shop-nav .brand img {
            height: 42px;
            width: auto;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--rust);
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-actions .icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.1rem;
        }
        .nav-actions .btn-cart {
            background: var(--rust);
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 22px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            text-decoration: none;
        }
        .page-wrap {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.05em;
        }
        .recommend-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }
        .recommend-card {
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .recommend-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        .recommend-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background-color: #f8f8f8;
            border-radius: 8px;
        }
        .recommend-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 8px 0 6px;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .recommend-price {
            color: #C0633A;
            font-size: 16px;
            font-weight: 700;
        }
        .auth-brand {
            font-family: var(--font-display, 'Inter', sans-serif);
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff; /* Đổi từ #ffffff thành var(--text-primary) để chữ hiển thị rõ trên nền sáng */
            line-height: 1;
            text-transform: none;
            margin-bottom: 0;
        }
        .auth-brand span {
            color: var(--rust);
        }
    </style>
</head>
<body>
<nav class="shop-nav">
    <a th:href="@{/}" class="brand">
        <img th:src="@{/logo.jpg}" src="/logo.jpg" alt="HatHub Logo">
        <div class="auth-brand">Hat<span>hub</span></div>
    </a>
    <div class="nav-actions">
        <a class="icon-link" th:if="${loggedIn}" th:href="@{/profile}" aria-label="Tài khoản">👤</a>
        <a class="icon-link" th:if="${loggedIn}" th:href="@{/cart}" aria-label="Giỏ hàng">🛒</a>
        <a class="icon-link" th:if="${loggedIn}" th:href="@{/orders}" aria-label="Đơn hàng">🧾</a>

        <a class="btn-cart" th:if="${session.user == null}" th:href="@{/login}">Đăng nhập</a>
        <a class="btn-cart" th:if="${session.user != null}" th:href="@{/logout}">Đăng xuất</a>
    </div>
</nav>

<main class="page-wrap">
    <div class="section-title">Có thể bạn cũng thích</div>

    <div class="recommend-grid">
        <div class="recommend-card" th:each="p : ${allRecommendProducts}">
            <a th:href="@{'/products/' + ${p.productId}}" style="text-decoration: none; color: inherit;">
                <img th:src="@{/images/no-image.png}" alt="Product Image">
                <div class="recommend-body" style="padding-top: 10px;">
                    <div class="recommend-name" th:text="${p.productName}">Tên sản phẩm</div>
                    <div class="recommend-price" th:if="${p.details != null and !#lists.isEmpty(p.details)}" th:text="${#numbers.formatDecimal(p.details[0].price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                    <div class="recommend-price" th:unless="${p.details != null and !#lists.isEmpty(p.details)}">Liên hệ</div>
                </div>
            </a>
        </div>
    </div>
</main>

</body>
</html>
