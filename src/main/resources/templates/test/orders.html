<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Quản lý đơn hàng | HatHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    body { font-family:'Nunito',sans-serif; margin:0; display:flex; min-height:100vh; }
    aside { width:220px; background:#111; color:#fff; padding:1.5rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0;}
    aside a { display:block; color:#ccc; text-decoration:none; padding:0.6rem 0; }
    aside a:hover, aside a.active { color:#C0633A; }
    main { flex:1; padding:2rem; background:#F5F0EA; }
    table { width:100%; background:#fff; border-collapse:collapse; }
    th, td { padding:0.75rem; border-bottom:1px solid #eee; text-align:left; font-size:0.9rem; }
    th { background:#111; color:#fff; }
    input#searchInput { padding:10px 14px; border:1px solid #ddd; border-radius:4px; width:340px; margin-bottom:1rem; font-family:'Nunito',sans-serif; }

    /* ===== Nút bấm — đồng bộ toàn hệ thống ===== */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:4px; font-family:'Nunito',sans-serif; font-weight:700; font-size:0.85rem; padding:9px 18px; cursor:pointer; text-decoration:none; line-height:1.2; white-space:nowrap; }
    .btn-sm { padding:6px 12px; font-size:0.8rem; }
    .btn-primary { background:#C0633A; color:#fff; }
    .btn-primary:hover { background:#9B4A27; }
    .btn-secondary { background:#444; color:#fff; }
    .btn-secondary:hover { background:#2c2c2c; }
    .btn-success { background:#27ae60; color:#fff; }
    .btn-success:hover { background:#1e8449; }
    .btn-danger { background:#c00; color:#fff; }
    .btn-danger:hover { background:#a00; }
    .btn-warning { background:#e67e22; color:#fff; }
    .btn-warning:hover { background:#c8611c; }
    .btn-info { background:#2980b9; color:#fff; }
    .btn-info:hover { background:#20648f; }
    .btn-neutral { background:#666; color:#fff; }
    .btn-neutral:hover { background:#4d4d4d; }

    /* FILTER TABS — dùng chung kiểu với trang Trả hàng / Voucher */
    .filter-tabs { display:flex; gap:8px; margin-bottom:1rem; flex-wrap:wrap; }
    .filter-tabs button { background:#fff; border:1px solid #ddd; color:#333; }
    .filter-tabs button.active { background:#C0633A; color:#fff; border-color:#C0633A; }
  </style>
</head>
<body>
<aside>
  <h2 style="color:#C0633A;">HatHub Admin</h2>
  <a href="/admin/dashboard">Dashboard</a>
  <a href="/admin/products">Sản phẩm</a>
  <a href="/admin/categories">Danh mục</a>
  <a href="/admin/brands">Thương hiệu</a>
  <a href="/admin/materials">Chất liệu</a>
  <a href="/admin/hat-types">Kiểu mũ</a>
  <a href="/admin/sizes">Size</a>
  <a href="/admin/colors">Màu sắc</a>
  <a href="/admin/orders" class="active">Đơn hàng</a>
  <a href="/admin/returns">Trả hàng</a>
  <a href="/admin/vouchers">Voucher</a>
  <a href="/admin/users">Người dùng</a>
  <a href="/logout">Đăng xuất</a>
</aside>
<main>
  <h1>Đơn hàng</h1>

  <input type="text" id="searchInput" placeholder="Tìm theo mã đơn, tên khách hoặc ngày (dd/MM/yyyy)..."
         onkeyup="applyFilters()"/>

  <!-- BỘ LỌC TRẠNG THÁI -->
  <div class="filter-tabs">
    <button type="button" class="btn btn-sm active" onclick="filterStatus('ALL')" id="btn-ALL">Tất cả</button>
    <button type="button" class="btn btn-sm" onclick="filterStatus('Chờ thanh toán')" id="btn-Chờ thanh toán">Chờ thanh toán</button>
    <button type="button" class="btn btn-sm" onclick="filterStatus('Chờ xác nhận')" id="btn-Chờ xác nhận">Chờ xác nhận</button>
    <button type="button" class="btn btn-sm" onclick="filterStatus('Đang xử lý')" id="btn-Đang xử lý">Đang xử lý</button>
    <button type="button" class="btn btn-sm" onclick="filterStatus('Đang giao')" id="btn-Đang giao">Đang giao</button>
    <button type="button" class="btn btn-sm" onclick="filterStatus('Xử lý sự cố giao hàng')" id="btn-Xử lý sự cố giao hàng">Xử lý sự cố giao hàng</button>
    <button type="button" class="btn btn-sm" onclick="filterStatus('Hoàn thành')" id="btn-Hoàn thành">Hoàn thành</button>
    <button type="button" class="btn btn-sm" onclick="filterStatus('Đã hủy')" id="btn-Đã hủy">Đã hủy</button>
  </div>

  <!-- SỐ LƯỢNG HIỂN THỊ -->
  <p id="countDisplay"
     style="font-size:0.85rem;color:#666;margin-bottom:0.8rem;">
    Đang hiển thị tất cả đơn hàng
  </p>

  <table>
    <thead>
    <tr><th>Mã</th><th>Khách hàng</th><th>Ngày</th><th>Tổng</th><th>Trạng thái</th><th>Cập nhật</th></tr>
    </thead>
    <tbody id="orderTableBody">
    <tr th:each="o : ${orders}" th:data-status="${o.status}">
      <td >
        <a th:href="@{/admin/orders/{id}(id=${o.orderId})}"
           th:text="${'#' + o.orderCode}"
           class="order-code"
           style="color:#C0633A;font-weight:700;">HH00000000</a>
      </td>
      <td th:text="${o.customer.user.username}" class="order-user">user</td>
      <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy')}" class="order-date">date</td>
      <td style="text-align: right" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0</td>
      <td th:text="${o.status}">status</td>
      <td>
        <!-- nút theo trạng thái -->
        <div th:if="${o.status == 'Chờ xác nhận'}" style="display:flex;gap:4px;">
          <form th:action="@{/admin/orders/{id}/status(id=${o.orderId})}" method="post" onsubmit="return confirm('Xác nhận đơn hàng?')">
            <input type="hidden" name="status" value="Đang xử lý"/>
            <button type="submit" class="btn btn-info btn-sm">Xác nhận</button>
          </form>
          <form th:action="@{/admin/orders/{id}/status(id=${o.orderId})}" method="post"
                onsubmit="return confirm('Hủy đơn hàng này?')">
            <input type="hidden" name="status" value="Đã hủy"/>
            <button type="submit" class="btn btn-danger btn-sm">Hủy</button>
          </form>
        </div>
        <div th:if="${o.status == 'Đang xử lý'}" style="display:flex;gap:4px;">
          <form th:action="@{/admin/orders/{id}/status(id=${o.orderId})}" method="post" onsubmit="return confirm('Giao đơn hàng này?')">
            <input type="hidden" name="status" value="Đang giao"/>
            <button type="submit" class="btn btn-warning btn-sm">Giao hàng</button>
          </form>
          <form th:action="@{/admin/orders/{id}/status(id=${o.orderId})}" method="post"
                onsubmit="return confirm('Chuyển đơn về trạng thái Chờ xác nhận?')">
            <input type="hidden" name="status" value="Chờ xác nhận"/>
            <button type="submit" class="btn btn-neutral btn-sm">↩ Quay lại</button>
          </form>
          <form th:action="@{/admin/orders/{id}/status(id=${o.orderId})}" method="post"
                onsubmit="return confirm('Hủy đơn hàng này?')">
            <input type="hidden" name="status" value="Đã hủy"/>
            <button type="submit" class="btn btn-danger btn-sm">Hủy</button>
          </form>
        </div>
        <div th:if="${o.status == 'Đang giao'}">
          <span style="color:#888;font-size:0.85rem;">Chờ khách nhận hàng</span>
        </div>
        <div th:if="${o.status == 'Hoàn thành'}">
          <span style="color:green;font-weight:700;">✓ Hoàn thành</span>
        </div>
        <div th:if="${o.status == 'Đã hủy'}">
          <span style="color:#c00;font-weight:700;">✗ Đã hủy</span>
        </div>
        <div th:if="${o.status == 'Chờ thanh toán'}" style="display:flex;gap:4px;align-items:center;">
          <span style="color:#e67e22;font-size:0.85rem;">Chờ thanh toán</span>
          <form th:action="@{/admin/orders/{id}/status(id=${o.orderId})}" method="post"
                onsubmit="return confirm('Hủy đơn hàng này?')">
            <input type="hidden" name="status" value="Đã hủy"/>
            <button type="submit" class="btn btn-danger btn-sm">Hủy</button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
<script>
  let currentStatus = 'ALL';

  function filterStatus(status) {
    currentStatus = status;
    document.querySelectorAll('.filter-tabs button').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + status)?.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const rows = document.querySelectorAll('#orderTableBody tr[data-status]');
    let count = 0;

    rows.forEach(row => {
      const rowStatus = row.getAttribute('data-status');
      const matchesStatus = (currentStatus === 'ALL' || rowStatus === currentStatus);

      let matchesKeyword = true;
      if (keyword) {
        const code = row.querySelector('.order-code')?.textContent.toLowerCase() || '';
        const user = row.querySelector('.order-user')?.textContent.toLowerCase() || '';
        const date = row.querySelector('.order-date')?.textContent.toLowerCase() || '';
        matchesKeyword = code.includes(keyword) || user.includes(keyword) || date.includes(keyword);
      }

      if (matchesStatus && matchesKeyword) {
        row.style.display = '';
        count++;
      } else {
        row.style.display = 'none';
      }
    });

    const countEl = document.getElementById('countDisplay');
    const statusLabel = currentStatus === 'ALL' ? 'tất cả' : 'trạng thái "' + currentStatus + '"';
    countEl.textContent = keyword
            ? 'Tìm "' + keyword + '" trong ' + statusLabel + ' — ' + count + ' đơn hàng'
            : 'Đang hiển thị ' + statusLabel + ' — ' + count + ' đơn hàng';
  }
</script>
</html>
