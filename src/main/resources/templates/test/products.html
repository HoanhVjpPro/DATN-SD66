<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Quản lý sản phẩm | HatHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    body { font-family:'Nunito',sans-serif; margin:0; display:flex; min-height:100vh; }
    aside { width:220px; background:#111; color:#fff; padding:1.5rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0;}
    aside a { display:block; color:#ccc; text-decoration:none; padding:0.6rem 0; }
    aside a.active { color:#C0633A; }
    aside a:hover { color:#C0633A; }
    main { flex:1; padding:2rem; background:#F5F0EA; }
    table { width:100%; background:#fff; border-collapse:collapse; }
    th, td { padding:0.75rem; border-bottom:1px solid #eee; text-align:left; }
    th { background:#111; color:#fff; }

    /* ===== Nút bấm — đồng bộ toàn hệ thống ===== */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:4px; font-family:'Nunito',sans-serif; font-weight:700; font-size:0.85rem; padding:9px 18px; cursor:pointer; text-decoration:none; line-height:1.2; white-space:nowrap; margin-bottom:1rem; }
    .btn-sm { padding:6px 12px; font-size:0.8rem; margin-bottom:0; }
    .btn-primary { background:#C0633A; color:#fff; }
    .btn-primary:hover { background:#9B4A27; }
    .btn-secondary { background:#444; color:#fff; }
    .btn-secondary:hover { background:#2c2c2c; }
    .btn-success { background:#27ae60; color:#fff; }
    .btn-success:hover { background:#1e8449; }
    .btn-danger { background:#c00; color:#fff; }
    .btn-danger:hover { background:#a00; }
    .btn-warning { background:#e67e22; color:#fff; }
    .btn-warning:hover { background:#c8611c; }
    .btn-info { background:#2980b9; color:#fff; }
    .btn-info:hover { background:#20648f; }
    .btn-neutral { background:#666; color:#fff; }
    .btn-neutral:hover { background:#4d4d4d; }
  </style>
</head>
<body>
<aside>
  <h2 style="color:#C0633A;">HatHub Admin</h2>
  <a href="/admin/dashboard">Dashboard</a>
  <a href="/admin/products" class="active">Sản phẩm</a>
  <a href="/admin/categories">Danh mục</a>
  <a href="/admin/brands">Thương hiệu</a>
  <a href="/admin/materials">Chất liệu</a>
  <a href="/admin/hat-types">Kiểu mũ</a>
  <a href="/admin/sizes">Size</a>
  <a href="/admin/colors">Màu sắc</a>
  <a href="/admin/orders">Đơn hàng</a>
  <a href="/admin/returns">Trả hàng</a>
  <a href="/admin/vouchers">Voucher</a>
  <a href="/admin/users">Người dùng</a>
  <a href="/logout">Đăng xuất</a>
</aside>
<main>
  <h1>Sản phẩm</h1>
  <a href="/admin/products/new" class="btn btn-primary">+ Thêm sản phẩm</a>
  <p th:text="${error}" style="color: red"></p>
  <p th:text="${success}" style="color: #1fff00"></p>
  <table>
    <thead><tr><th>#</th><th>Tên</th><th>Danh mục</th><th>Thương hiệu</th><th>Trạng thái</th><th></th></tr></thead>
    <tbody>
    <tr th:each="p, index : ${products}">
      <td th:text="${index.count}">1</td>
      <td th:text="${p.productName}">Name</td>
      <td th:text="${p.category.categoryName}">Cat</td>
      <td th:text="${p.brand.brandName}">Bra</td>
      <td th:text="${p.status ? 'Đang bán' : 'Ẩn'}">status</td>
      <td>
        <a th:href="@{/admin/products/edit/{id}(id=${p.productId})}"
           class="btn btn-secondary btn-sm" style="margin-right:4px;">Sửa</a>

        <form th:action="@{/admin/products/delete/{id}(id=${p.productId})}" onsubmit="return confirm('Sản phẩm này có thể còn các biến thể! bạn vẫn muốn xóa chứ?')" method="post" style="display:inline;">
          <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
