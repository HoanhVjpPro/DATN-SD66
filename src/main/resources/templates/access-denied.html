<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Không có quyền truy cập</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #0a0a0f;
            --grid:    rgba(255,255,255,0.03);
            --red:     #ff3b3b;
            --red2:    #ff6b6b;
            --red-dim: rgba(255,59,59,0.08);
            --red-glow:rgba(255,59,59,0.15);
            --text1:   #f0ede8;
            --text2:   #7a7870;
            --text3:   #3d3c3a;
            --border:  rgba(255,59,59,0.2);
            --mono:    'Space Mono', monospace;
            --sans:    'Be Vietnam Pro', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--sans);
            overflow: hidden;
            position: relative;
        }

        /* Grid nền */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                    linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: 0;
        }

        /* Glow đỏ giữa màn hình */
        body::after {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 400px;
            background: radial-gradient(ellipse, rgba(255,59,59,0.07) 0%, transparent 70%);
            z-index: 0;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: .6; transform: translate(-50%,-50%) scale(1); }
            50%      { opacity: 1;  transform: translate(-50%,-50%) scale(1.1); }
        }

        /* Scan line */
        .scanline {
            position: fixed; top: -100%;
            left: 0; right: 0; height: 40px;
            background: linear-gradient(transparent, rgba(255,59,59,0.04), transparent);
            z-index: 1;
            animation: scan 6s linear infinite;
        }
        @keyframes scan { to { top: 100%; } }

        /* Wrapper */
        .wrap {
            position: relative; z-index: 2;
            text-align: center;
            padding: 0 24px;
            animation: fadeUp .6s ease both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* Code lớn */
        .code-block {
            font-family: var(--mono);
            font-size: clamp(80px,14vw,144px);
            font-weight: 700;
            color: var(--red);
            line-height: 1;
            letter-spacing: -4px;
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        /* Glitch effect */
        .code-block::before,
        .code-block::after {
            content: '403';
            position: absolute; top: 0; left: 0; right: 0;
        }
        .code-block::before {
            color: #00ffe5;
            clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
            animation: glitch1 3s infinite;
            opacity: 0;
        }
        .code-block::after {
            color: #ff00aa;
            clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
            animation: glitch2 3s infinite;
            opacity: 0;
        }
        @keyframes glitch1 {
            0%,90%,100% { opacity:0; transform:translate(0); }
            91%          { opacity:.7; transform:translate(-3px,1px); }
            93%          { opacity:.7; transform:translate(3px,-1px); }
            95%          { opacity:0; }
        }
        @keyframes glitch2 {
            0%,90%,100% { opacity:0; transform:translate(0); }
            92%          { opacity:.6; transform:translate(4px,0); }
            94%          { opacity:.6; transform:translate(-4px,1px); }
            96%          { opacity:0; }
        }

        /* Badge */
        .badge {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--red-dim);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 14px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--red);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--red);
            animation: blink 1.2s step-end infinite;
        }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

        /* Tiêu đề */
        .title {
            font-size: clamp(20px,3vw,28px);
            font-weight: 600;
            color: var(--text1);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .desc {
            font-size: 15px;
            color: var(--text2);
            line-height: 1.7;
            max-width: 380px;
            margin: 0 auto 36px;
            font-weight: 300;
        }

        /* Divider */
        .divider {
            width: 60px; height: 1px;
            background: var(--border);
            margin: 0 auto 36px;
        }

        /* Buttons */
        .btn-group {
            display: flex; gap: 12px;
            justify-content: center; flex-wrap: wrap;
        }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 24px;
            border-radius: 4px;
            font-family: var(--sans);
            font-size: 14px; font-weight: 500;
            cursor: pointer; text-decoration: none;
            transition: all .2s; border: none;
            position: relative; overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.05);
            opacity: 0; transition: opacity .15s;
        }
        .btn:hover::after { opacity: 1; }

        .btn-back {
            background: var(--red);
            color: #fff;
            box-shadow: 0 0 20px rgba(255,59,59,0.3);
        }
        .btn-back:hover {
            background: var(--red2);
            box-shadow: 0 0 32px rgba(255,59,59,0.5);
            transform: translateY(-1px);
        }
        .btn-back svg { width:16px; height:16px; }

        .btn-home {
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--text3);
        }
        .btn-home:hover {
            border-color: var(--text2);
            color: var(--text1);
            transform: translateY(-1px);
        }
        .btn-home svg { width:16px; height:16px; }

        /* Info nhỏ dưới */
        .info {
            margin-top: 40px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text3);
            letter-spacing: .5px;
        }
        .info span { color: var(--text2); }

        /* Corner decorations */
        .corner {
            position: fixed;
            width: 40px; height: 40px;
            z-index: 2;
            opacity: .4;
        }
        .corner svg { width:100%; height:100%; }
        .tl { top: 20px; left: 20px; }
        .tr { top: 20px; right: 20px; transform: scaleX(-1); }
        .bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
        .br { bottom: 20px; right: 20px; transform: scale(-1); }
    </style>
</head>
<body>

<div class="scanline"></div>

<!-- Corner decorations -->
<div class="corner tl"><svg viewBox="0 0 40 40" fill="none">
    <path d="M0 20 L0 0 L20 0" stroke="#ff3b3b" stroke-width="1.5"/>
</svg></div>
<div class="corner tr"><svg viewBox="0 0 40 40" fill="none">
    <path d="M0 20 L0 0 L20 0" stroke="#ff3b3b" stroke-width="1.5"/>
</svg></div>
<div class="corner bl"><svg viewBox="0 0 40 40" fill="none">
    <path d="M0 20 L0 0 L20 0" stroke="#ff3b3b" stroke-width="1.5"/>
</svg></div>
<div class="corner br"><svg viewBox="0 0 40 40" fill="none">
    <path d="M0 20 L0 0 L20 0" stroke="#ff3b3b" stroke-width="1.5"/>
</svg></div>

<div class="wrap">
    <div class="code-block">403</div>

    <div class="badge">ACCESS DENIED</div>

    <h1 class="title">Bạn không có quyền truy cập trang này</h1>

    <p class="desc">
        Tài khoản của bạn không có quyền xem trang này.
    </p>

    <div class="divider"></div>

    <div class="btn-group">
        <button class="btn btn-back" onclick="goBack()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Quay lại
        </button>

        <a class="btn btn-home" href="/">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Về trang chủ
        </a>
    </div>

    <div class="info">
        Mã lỗi: <span>HTTP 403 FORBIDDEN</span>
        &nbsp;·&nbsp;
        Thời gian: <span id="time"></span>
    </div>
</div>

<script>
    function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2,'0');
        const m = String(now.getMinutes()).padStart(2,'0');
        const s = String(now.getSeconds()).padStart(2,'0');
        document.getElementById('time').textContent = `${h}:${m}:${s}`;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // Nút quay lại
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = '/';
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') goBack();
    });
</script>

</body>
</html>
