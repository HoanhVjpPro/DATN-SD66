<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tài khoản | HatHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Barlow+Condensed:wght@500;700;900&display=swap&subset=vietnamese" rel="stylesheet" />
  <style>
    /* ===== RESET & VARIABLES ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #111111;
      --off-black: #1a1a1a;
      --rust: #C0633A;
      --rust-light: #D97C4E;
      --rust-dark: #9B4A27;
      --white: #ffffff;
      --cream: #F5F0EA;
      --gray-100: #f0efee;
      --gray-400: #9e9b96;
      --gray-700: #3e3d3a;
      --font-display: 'Barlow Condensed', 'Segoe UI', Roboto, Arial, sans-serif;
      --font-body: 'Nunito', 'Segoe UI', Roboto, Arial, sans-serif;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
    }

    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--black);
      min-height: 100vh;
      line-height: 1.6;
      margin: 0;
    }

    a { text-decoration: none; color: inherit; }

    /* ===== NAVIGATION ===== */
    .shop-nav {
      background: var(--black);
      padding: 14px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.8rem;
      color: var(--white);
      letter-spacing: 1px;
      /* ĐÃ BỎ text-transform: uppercase ĐỂ HIỂN THỊ "HatHub" */
    }
    .brand img {
      height: 44px;
      width: 44px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--rust);
      flex-shrink: 0;
    }
    .brand span { color: var(--white); }
    .brand span::after {
      content: 'hub';
      color: var(--rust);
    }

    .nav-right a {
      color: var(--gray-400);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .nav-right a:hover { color: var(--rust-light); }

    /* ===== PAGE WRAP ===== */
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .page-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 2.8rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
      color: var(--black);
      position: relative;
    }
    .page-title::after {
      content: '';
      display: block;
      width: 80px;
      height: 4px;
      background: var(--rust);
      margin-top: 8px;
      border-radius: 4px;
    }

    /* ===== ALERTS ===== */
    .alert {
      padding: 16px 20px;
      border-radius: var(--radius);
      margin-bottom: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .alert.success {
      background: #d4edda;
      color: #155724;
      border-left: 6px solid #28a745;
    }
    .alert.error {
      background: #f8dddd;
      color: #721c24;
      border-left: 6px solid #dc3545;
    }

    /* ===== PROFILE GRID ===== */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      margin-top: 1rem;
    }

    /* ===== CARDS ===== */
    .card {
      background: var(--white);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: box-shadow 0.3s;
    }
    .card:hover {
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
    }

    .card-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--black);
      margin-bottom: 1.8rem;
      border-bottom: 2px solid var(--rust);
      padding-bottom: 0.6rem;
      display: inline-block;
    }

    /* ===== FORM ===== */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--gray-100);
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: var(--gray-100);
      color: var(--black);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--rust);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(192, 99, 58, 0.1);
    }

    .form-group input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #e9e9e9;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      font-family: 'Nunito', 'Segoe UI', Roboto, Arial, sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
      margin-top: 6px;
    }

    .btn-primary {
      background: var(--rust);
      color: var(--white);
      box-shadow: 0 6px 20px rgba(192, 99, 58, 0.3);
    }
    .btn-primary:hover {
      background: var(--rust-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(192, 99, 58, 0.4);
    }

    .btn-secondary {
      background: var(--black);
      color: var(--white);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    .btn-secondary:hover {
      background: var(--off-black);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
    }

    /* ===== NOTE ===== */
    .form-note {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: var(--gray-400);
      text-align: center;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 992px) {
      .profile-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .page-title { font-size: 2.2rem; }
    }

    @media (max-width: 600px) {
      .shop-nav {
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 5%;
      }
      .brand { font-size: 1.4rem; }
      .brand img { height: 36px; width: 36px; }
      .card { padding: 1.5rem; }
      .page-wrap { padding: 1.5rem 1rem; }
      .btn {
        padding: 12px 20px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== NAV ===== -->
<nav class="shop-nav">
  <a href="/" class="brand">
    <img th:src="@{/logo.jpg}" src="/logo.jpg" alt="HatHub Logo" />
    <span>Hat</span>
  </a>
  <div class="nav-right">
    <a href="/">← Về trang chủ</a>
  </div>
</nav>

<!-- ===== MAIN ===== -->
<main class="page-wrap">
  <h1 class="page-title">Tài khoản của tôi</h1>

  <!-- ALERTS -->
  <div th:if="${success}" class="alert success" th:text="${success}">✅ Cập nhật thành công!</div>
  <div th:if="${error}" class="alert error" th:text="${error}">❌ Có lỗi xảy ra.</div>

  <!-- PROFILE GRID -->
  <div class="profile-grid">

    <!-- ===== CỘT 1: THÔNG TIN CÁ NHÂN ===== -->
    <section class="card">
      <h2 class="card-title">Thông tin cá nhân</h2>
      <form action="/profile/update" method="post">
        <div class="form-group">
          <label>Tên đăng nhập</label>
          <input th:value="${user.username}" disabled />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" th:value="${user.email}" placeholder="Email của bạn" />
        </div>

        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" name="phone" th:value="${user.phone}" placeholder="Số điện thoại" />
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật thông tin</button>
      </form>

      <!-- Nút xem đơn hàng -->
      <a href="/orders" class="btn btn-secondary" style="margin-top: 14px;">
        📦 Xem đơn hàng của bạn
      </a>
    </section>

    <!-- ===== CỘT 2: ĐỔI MẬT KHẨU ===== -->
    <section class="card">
      <h2 class="card-title">Đổi mật khẩu</h2>
      <form action="/profile/change-password" method="post">
        <div class="form-group">
          <label>Mật khẩu hiện tại</label>
          <input type="password" name="oldPassword" required placeholder="Nhập mật khẩu cũ" />
        </div>

        <div class="form-group">
          <label>Mật khẩu mới</label>
          <input type="password" name="newPassword" required minlength="4" placeholder="Tối thiểu 4 ký tự" />
        </div>

        <div class="form-group">
          <label>Xác nhận mật khẩu mới</label>
          <input type="password" name="confirmPassword" required minlength="4" placeholder="Nhập lại mật khẩu mới" />
        </div>

        <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
      </form>

      <p class="form-note">🔒 Vui lòng không chia sẻ mật khẩu với bất kỳ ai.</p>
    </section>

  </div>
</main>

</body>
</html>
